<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRIJAN — Login</title><style>
:root{--bg:#090c10;--panel:#12161c;--text:#f5f5f0;--muted:#9ca3af;--line:#28303a;--gold:#e9b95e;--gold2:#ffe2a0;--red:#ff9a9a;--green:#8ce2b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#2a210f,transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(520px,calc(100% - 28px));margin:auto;padding:60px 0}.logo{font-weight:900;letter-spacing:.13em;color:#fff;text-decoration:none}.logo b{color:var(--gold)}.card{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 20px 80px #0005}h1{font:2.4rem Georgia,serif;margin:8px 0}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:.8rem;font-weight:800}.field input{width:100%;padding:13px;background:#0c1015;border:1px solid var(--line);border-radius:11px;color:#fff;outline:none}.field input:focus{border-color:#8b6d36}.btn{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#171c22;color:#fff;font-weight:900;cursor:pointer;margin-top:8px}.primary{background:var(--gold);border-color:var(--gold);color:#17130b}.tabs{display:grid;grid-template-columns:1fr 1fr;margin:20px 0;border:1px solid var(--line);border-radius:11px;overflow:hidden}.tab{padding:11px;background:#10141a;color:#aab2bd;border:0;cursor:pointer;font-weight:800}.tab.active{background:#211b0e;color:var(--gold2)}.error{color:var(--red);font-size:.85rem;min-height:22px}.ok{color:var(--green);font-size:.85rem}.small{font-size:.78rem}.links{display:flex;justify-content:space-between;gap:10px;margin-top:15px}.links button{background:none;border:0;color:var(--gold2);cursor:pointer}.hidden{display:none}.security{margin-top:20px;padding:13px;border:1px solid var(--line);border-radius:12px;color:#aeb6c1;font-size:.78rem}.security b{color:#fff}@media(max-width:500px){.wrap{padding-top:35px}}
</style></head><body><main class="wrap"><a class="logo" href="index.html">SRIJAN<b>.</b></a><section class="card"><span class="muted">Customer portal</span><h1 id="title">Welcome back.</h1><p class="muted" id="subtitle">Sign in to track enquiries, orders and projects.</p><div class="tabs"><button class="tab active" id="loginTab">Login</button><button class="tab" id="signupTab">Create account</button></div><form id="form"><div class="field hidden" id="nameField"><label>Full name</label><input id="name" autocomplete="name"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required></div><button class="btn primary" id="submit">Login</button></form><div class="links"><button id="reset">Forgot password?</button><a href="services.html" style="color:#9ca3af">Browse services</a></div><div class="error" id="error"></div><div class="ok" id="ok"></div><div class="security"><b>Security:</b> SRIJAN uses Supabase Auth for password hashing/session handling. Passwords are never stored by the SRIJAN frontend.</div></section></main><script type="module">
import {supabase} from './auth.js';
const $=id=>document.getElementById(id);let mode='login';
function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('nameField').classList.toggle('hidden',m==='login');$('title').textContent=m==='login'?'Welcome back.':'Create your SRIJAN account.';$('subtitle').textContent=m==='login'?'Sign in to track enquiries, orders and projects.':'Create an account to access your customer dashboard.';$('submit').textContent=m==='login'?'Login':'Create account';$('reset').classList.toggle('hidden',m!=='login');$('error').textContent='';$('ok').textContent=''}
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
if(new URLSearchParams(location.search).get('setup'))$('error').textContent='Connect Supabase first: add your URL and anon/publishable key in supabase-config.js.';
$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';$('ok').textContent='';if(!supabase){$('error').textContent='Supabase is not configured yet. See SETUP.md.';return}const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim();let result;if(mode==='login')result=await supabase.auth.signInWithPassword({email,password});else result=await supabase.auth.signUp({email,password,options:{data:{full_name:name}}});if(result.error){$('error').textContent=result.error.message;return}if(mode==='signup'&&!result.data.session){$('ok').textContent='Account created. Check your email to verify your account, then log in.';return}location.href='dashboard.html'};
$('reset').onclick=async()=>{if(!supabase){$('error').textContent='Supabase is not configured yet.';return}const email=$('email').value.trim();if(!email){$('error').textContent='Enter your email first.';return}const r=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/auth.html?reset=1'});if(r.error)$('error').textContent=r.error.message;else $('ok').textContent='Password reset email sent. Check your inbox.'};
if(new URLSearchParams(location.search).get('reset'))$('ok').textContent='Open the password-reset link from your email to continue.';
</script></body></html>
