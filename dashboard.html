<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRIJAN — Dashboard</title><style>
:root{--bg:#090c10;--panel:#12161c;--panel2:#0f1318;--text:#f5f5f0;--muted:#9ca3af;--line:#28303a;--gold:#e9b95e;--gold2:#ffe2a0;--green:#8ce2b8;--red:#ff9a9a;--max:1180px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(var(--max),calc(100% - 28px));margin:auto}.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center}.navin{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:.13em}.logo b{color:var(--gold)}.user{display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:#171c22;color:#fff;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:#17130b;border-color:var(--gold)}.hero{padding:45px 0 25px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px}.stat b{display:block;font-size:1.9rem;color:var(--gold2);margin-top:5px}.section{margin:28px 0}.section h2{font:1.8rem Georgia,serif}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.badge{padding:4px 8px;border-radius:999px;background:#211b0e;color:var(--gold2);font-size:.72rem;font-weight:800}.empty{color:#7f8995;padding:15px 0}.quick{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.user span{display:none}}
</style></head><body><nav class="nav"><div class="wrap navin"><a class="logo" href="index.html">SRIJAN<b>.</b></a><div class="user"><span id="email" class="muted"></span><button class="btn" id="logout">Logout</button></div></div></nav><main class="wrap"><section class="hero"><span class="muted">Customer dashboard</span><h1 id="welcome">Welcome.</h1><p class="muted">Everything important about your SRIJAN work in one place.</p><div class="quick"><a class="btn primary" href="services.html">Browse services</a><a class="btn" href="pay.html">Start an enquiry</a></div></section><section class="grid"><article class="card stat"><span class="muted">Enquiries</span><b id="enquiriesCount">0</b></article><article class="card stat"><span class="muted">Paid orders</span><b id="ordersCount">0</b></article><article class="card stat"><span class="muted">Active projects</span><b id="projectsCount">0</b></article><article class="card stat"><span class="muted">Unread updates</span><b id="notificationsCount">0</b></article></section><section class="section card"><h2>My enquiries</h2><div id="enquiries" class="list"><div class="empty">Loading…</div></div></section><section class="section card"><h2>My orders</h2><div id="orders" class="list"><div class="empty">Loading…</div></div></section><section class="section card"><h2>My projects</h2><div id="projects" class="list"><div class="empty">Loading…</div></div></section></main><script type="module">
import {supabase,requireUser,signOut} from './auth.js';const $=id=>document.getElementById(id);const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const user=await requireUser();if(user){$('email').textContent=user.email;const p=await supabase.from('profiles').select('full_name').eq('id',user.id).single();$('welcome').textContent=`Welcome${p.data?.full_name?' '+p.data.full_name.split(' ')[0]:''}.`;const [e,o,pr,n]=await Promise.all([supabase.from('enquiries').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(10),supabase.from('orders').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(10),supabase.from('projects').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(10),supabase.from('notifications').select('id').eq('user_id',user.id).is('read_at',null)]);const es=e.data||[],os=o.data||[],ps=pr.data||[];$('enquiriesCount').textContent=es.length;$('ordersCount').textContent=os.filter(x=>x.payment_status==='captured').length;$('projectsCount').textContent=ps.filter(x=>x.status==='active').length;$('notificationsCount').textContent=(n.data||[]).length;$('enquiries').innerHTML=es.length?es.map(x=>`<div class="item"><div><b>${x.enquiry_code}</b><div class="muted small">${new Date(x.created_at).toLocaleDateString('en-IN')} · ₹${Number(x.estimated_value||0).toLocaleString('en-IN')}</div></div><span class="badge">${x.status}</span></div>`).join(''):'<div class="empty">No enquiries yet.</div>';$('orders').innerHTML=os.length?os.map(x=>`<div class="item"><div><b>${x.order_code}</b><div class="muted">${money(x.total)} · ${new Date(x.created_at).toLocaleDateString('en-IN')}</div></div><span class="badge">${x.payment_status}</span></div>`).join(''):'<div class="empty">No paid orders yet.</div>';$('projects').innerHTML=ps.length?ps.map(x=>`<div class="item"><div><b>${x.title}</b><div class="muted">${x.project_code} · ${x.progress}% complete</div></div><span class="badge">${x.status}</span></div>`).join(''):'<div class="empty">No active projects yet.</div>'}$('logout').onclick=signOut}
</script></body></html>
