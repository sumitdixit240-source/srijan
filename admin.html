<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRIJAN — Admin</title><style>
:root{--bg:#090c10;--panel:#12161c;--panel2:#0f1318;--text:#f5f5f0;--muted:#9ca3af;--line:#28303a;--gold:#e9b95e;--gold2:#ffe2a0;--green:#8ce2b8;--red:#ff9a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1220px,calc(100% - 28px));margin:auto}.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center}.navin{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:.13em}.logo b{color:var(--gold)}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:#171c22;color:#fff;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:#17130b;border-color:var(--gold)}.danger{color:#ffb1b1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:28px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.stat b{display:block;font-size:1.9rem;color:var(--gold2);margin-top:4px}.section{margin:24px 0}.section h2{font:1.7rem Georgia,serif}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:.86rem}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#211b0e;color:var(--gold2);font-size:.7rem;font-weight:800}.service-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{width:100%;padding:11px;background:#0c1015;color:#fff;border:1px solid var(--line);border-radius:10px}.field textarea{min-height:80px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.message{min-height:22px;font-size:.85rem}.green{color:var(--green)}.red{color:var(--red)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.service-form{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><nav class="nav"><div class="wrap navin"><a class="logo" href="index.html">SRIJAN<b>.</b> <span class="muted" style="font-size:.7rem">ADMIN</span></a><div><a class="btn" href="dashboard.html">Customer view</a> <button class="btn" id="logout">Logout</button></div></div></nav><main class="wrap"><div id="gate" class="card" style="margin-top:30px">Checking admin access…</div><div id="app" style="display:none"><section class="grid"><article class="card stat"><span class="muted">Users</span><b id="users">0</b></article><article class="card stat"><span class="muted">Enquiries</span><b id="enquiries">0</b></article><article class="card stat"><span class="muted">Paid orders</span><b id="orders">0</b></article><article class="card stat"><span class="muted">Services</span><b id="services">0</b></article></section><section class="section card"><h2>Service management</h2><p class="muted">Add, publish, hide or edit services. User-facing pages can later read this same database.</p><form id="serviceForm" class="service-form"><input type="hidden" id="sid"><div class="field"><label>Name</label><input id="sname" required></div><div class="field"><label>Slug</label><input id="sslug" required></div><div class="field"><label>Price (₹)</label><input id="sprice" type="number" min="0" required></div><div class="field"><label>Delivery</label><input id="sdelivery" required></div><div class="field full"><label>Description</label><textarea id="sdesc"></textarea></div><div class="field"><label>Status</label><select id="sstatus"><option>published</option><option>draft</option><option>hidden</option></select></div><div class="field"><label>Visibility</label><select id="svisibility"><option>public</option><option>logged_in</option></select></div><div class="actions full"><button class="btn primary">Save service</button><button type="button" class="btn" id="clear">Clear</button></div></form><div class="message" id="msg"></div><div style="overflow:auto;margin-top:20px"><table class="table"><thead><tr><th>Service</th><th>Price</th><th>Status</th><th>Visibility</th><th>Action</th></tr></thead><tbody id="serviceRows"></tbody></table></div></section><section class="section card"><h2>Latest enquiries</h2><div style="overflow:auto"><table class="table"><thead><tr><th>ID</th><th>Customer</th><th>Business</th><th>Value</th><th>Status</th><th>Action</th></tr></thead><tbody id="enquiryRows"></tbody></table></div></section></div></main><script type="module">
import {supabase,requireAdmin,signOut} from './auth.js';const $=id=>document.getElementById(id);const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const gate=$('gate');const admin=await requireAdmin();if(!admin){}else{$('logout').onclick=signOut;gate.style.display='none';$('app').style.display='block';async function load(){const [p,e,o,s]=await Promise.all([supabase.from('profiles').select('id'),supabase.from('enquiries').select('*').order('created_at',{ascending:false}).limit(50),supabase.from('orders').select('*').order('created_at',{ascending:false}).limit(50),supabase.from('services').select('*').order('created_at',{ascending:false})]);$('users').textContent=(p.data||[]).length;$('enquiries').textContent=(e.data||[]).length;$('orders').textContent=(o.data||[]).filter(x=>x.payment_status==='captured').length;$('services').textContent=(s.data||[]).length;$('serviceRows').innerHTML=(s.data||[]).map(x=>`<tr><td>${x.emoji||''} ${x.name}</td><td>${money(x.price)}</td><td><span class="badge">${x.status}</span></td><td>${x.visibility}</td><td><button class="btn edit" data-id="${x.id}">Edit</button></td></tr>`).join('');$('enquiryRows').innerHTML=(e.data||[]).map(x=>`<tr><td>${x.enquiry_code}</td><td>${x.customer_name}<br><span class="muted">${x.customer_email}</span></td><td>${x.business_name}</td><td>${money(x.estimated_value)}</td><td><select class="estatus" data-id="${x.id}"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='reviewing'?'selected':''}>reviewing</option><option ${x.status==='quoted'?'selected':''}>quoted</option><option ${x.status==='converted'?'selected':''}>converted</option><option ${x.status==='closed'?'selected':''}>closed</option></select></td><td><button class="btn save-enq" data-id="${x.id}">Save</button></td></tr>`).join('');document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>{const x=(s.data||[]).find(v=>v.id===b.dataset.id);if(!x)return;$('sid').value=x.id;$('sname').value=x.name;$('sslug').value=x.slug;$('sprice').value=x.price;$('sdelivery').value=x.delivery;$('sdesc').value=x.description;$('sstatus').value=x.status;$('svisibility').value=x.visibility;scrollTo({top:400,behavior:'smooth'})});document.querySelectorAll('.save-enq').forEach(b=>b.onclick=async()=>{const status=document.querySelector(`.estatus[data-id="${b.dataset.id}"]`).value;const r=await supabase.from('enquiries').update({status,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);if(r.error)alert(r.error.message);else load()})}
$('serviceForm').onsubmit=async ev=>{ev.preventDefault();$('msg').textContent='Saving…';const id=$('sid').value;const data={name:$('sname').value.trim(),slug:$('sslug').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'-'),price:Number($('sprice').value),delivery:$('sdelivery').value.trim(),description:$('sdesc').value.trim(),status:$('sstatus').value,visibility:$('svisibility').value,updated_at:new Date().toISOString()};let r=id?await supabase.from('services').update(data).eq('id',id):await supabase.from('services').insert(data);if(r.error){$('msg').innerHTML=`<span class="red">${r.error.message}</span>`}else{$('msg').innerHTML='<span class="green">Saved.</span>';$('serviceForm').reset();$('sid').value='';load()}};$('clear').onclick=()=>{$('serviceForm').reset();$('sid').value='';$('msg').textContent=''};load()}
</script></body></html>
